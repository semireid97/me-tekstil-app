name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev mesa-utils

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Accept Flutter Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Stable Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.25.2"

      - name: Build Android APK
        run: |
          flet build apk --project "me_tekstil_erp" --org "com.metekstil.erp" --flutter-build-args="--android-skip-build-dependency-validation" --no-rich-output -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: me-tekstil-erp-apk
          path: build/apk/*.apk
          
