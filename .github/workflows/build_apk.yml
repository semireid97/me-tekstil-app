name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"
          pip install -r requirements.txt

      - name: Build APK via Flet
        run: |
          flet build apk --org com.metekstil.erp --project "ME Tekstil ERP"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ME_Tekstil_ERP_APK
          path: build/apk/*.apk
