name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --project-name me_tekstil_erp --org com.metekstil.erp --no-rich-output

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ME_Tekstil_ERP_APK
          path: |
            build/apk/*.apk
            dist/*.apk
            *.apk
          if-no-files-found: error
